# tox.ini — Cross-version compatibility test matrix for gliquid.
#
# Environments:
#   py{310,311,312,313}-max   All packages at latest allowed version (control group)
#   py{310,311,312,313}-min   All packages pinned to minimum allowed version
#   py{310,311,312,313}-max-notebooks  Notebook execution on max envs
#
# The pytest envs run BOTH tiers (`pytest tests tests_internal`), not a bare `pytest`.
# tests_internal/ holds the value pins, the figure goldens and the gated families -- exactly
# the tests most sensitive to version-dependent numerical drift, and the reason this matrix
# exists. It is what caught the La-Sn colour-cycling failure that appeared only on py311+,
# because convex-hull ordering is Python-version-dependent. Narrowing these commands back to
# `pytest tests/` silently drops that coverage without failing anything.
# The needs_network test in tests_internal/ SKIPS here unless NEW_MP_API_KEY is passed in.
#
# Local (conda) usage — set GLIQTEST_PY3XX env vars before running:
#   $env:GLIQTEST_PY310 = "C:\Users\willwerj\miniforge3\envs\gliquidenv\python.exe"
#   $env:GLIQTEST_PY311 = "C:\Users\willwerj\miniforge3\envs\gliqtest-py311\python.exe"
#   $env:GLIQTEST_PY312 = "C:\Users\willwerj\miniforge3\envs\gliqtest-py312\python.exe"
#   $env:GLIQTEST_PY313 = "C:\Users\willwerj\miniforge3\envs\gliqtest-py313\python.exe"
#   & "C:\Users\willwerj\miniforge3\Scripts\tox.exe" -p 4
#
# CI (GitHub Actions, Ubuntu): python3.10 / python3.11 / ... are in PATH by default.
#
# Notes on Windows/conda:
#   - wheel_build_env = .pkg forces all test environments to share the single .pkg
#     build environment (Python 3.10 from the tox runner). This avoids tox's automatic
#     creation of per-Python-version .pkg-cpythonXXX build envs, which require
#     python3.11 / python3.12 / python3.13 to be accessible by name in PATH — those
#     resolve to the Windows Store placeholder on Windows/conda. gliquid is pure Python
#     so the 3.10-built wheel is compatible with all tested Python versions.
#   - For min envs: copy requirements/min-constraints.txt to a path WITHOUT spaces (the
#     Dropbox path has spaces), then set GLIQUID_MIN_CONSTRAINTS to that path. Do NOT set
#     PIP_CONSTRAINT directly — it leaks into all tox envs (including max) regardless of
#     passenv. Instead, min envs convert GLIQUID_MIN_CONSTRAINTS → PIP_CONSTRAINT via setenv.
#   - Max envs never see PIP_CONSTRAINT because it is never set in the outer shell.

[tox]
envlist =
    py{310,311,312,313}-{min,max}
minversion = 4.0
isolated_build = true

# ---------------------------------------------------------------------------
# Max environments — latest allowed package versions, no version floor
# ---------------------------------------------------------------------------
[testenv:py{310,311,312,313}-max]
basepython =
    py310: {env:GLIQTEST_PY310:python3.10}
    py311: {env:GLIQTEST_PY311:python3.11}
    py312: {env:GLIQTEST_PY312:python3.12}
    py313: {env:GLIQTEST_PY313:python3.13}
package = wheel
wheel_build_env = .pkg
extras = test
passenv =
    NEW_MP_API_KEY
    GLIQTEST_PY310
    GLIQTEST_PY311
    GLIQTEST_PY312
    GLIQTEST_PY313
setenv =
    GLIQUID_TEST_VERSION_GROUP = {env_name}
    # These envs install a WHEEL, so gliquid resolves from site-packages and its
    # __file__-anchored checkout walk cannot find this repo. The external cache corpus
    # (per-system DFT caches, MPDS diagrams) is not shipped in the wheel by design, so
    # point at the working tree's copy explicitly. Without this every cache-reading test
    # raises config.ConfigError. The directory is cache/ (it was data/ before 0.2) and
    # the variable is GLIQUID_CACHE_DIR (GLIQUID_DATA_DIR still works, deprecated).
    GLIQUID_CACHE_DIR = {toxinidir}/cache
commands =
    pytest tests tests_internal -v --tb=short

# ---------------------------------------------------------------------------
# Min environments — all packages pinned to minimum allowed versions
# ---------------------------------------------------------------------------
[testenv:py{310,311,312,313}-min]
basepython =
    py310: {env:GLIQTEST_PY310:python3.10}
    py311: {env:GLIQTEST_PY311:python3.11}
    py312: {env:GLIQTEST_PY312:python3.12}
    py313: {env:GLIQTEST_PY313:python3.13}
package = wheel
wheel_build_env = .pkg
extras = test
passenv =
    NEW_MP_API_KEY
    GLIQTEST_PY310
    GLIQTEST_PY311
    GLIQTEST_PY312
    GLIQTEST_PY313
    GLIQUID_MIN_CONSTRAINTS
setenv =
    GLIQUID_TEST_VERSION_GROUP = {env_name}
    PIP_CONSTRAINT = {env:GLIQUID_MIN_CONSTRAINTS}
    # See the max envs: wheel install, so the corpus has to be named explicitly.
    GLIQUID_CACHE_DIR = {toxinidir}/cache
commands =
    pytest tests tests_internal -v --tb=short

# ---------------------------------------------------------------------------
# Notebook environments (run after confirming tests pass)
# ---------------------------------------------------------------------------
[testenv:py{310,311,312,313}-max-notebooks]
basepython =
    py310: {env:GLIQTEST_PY310:python3.10}
    py311: {env:GLIQTEST_PY311:python3.11}
    py312: {env:GLIQTEST_PY312:python3.12}
    py313: {env:GLIQTEST_PY313:python3.13}
package = wheel
wheel_build_env = .pkg
extras = test,notebook
deps =
    nbconvert>=7.0
passenv =
    NEW_MP_API_KEY
    GLIQTEST_PY310
    GLIQTEST_PY311
    GLIQTEST_PY312
    GLIQTEST_PY313
setenv =
    # See the max envs: wheel install, so the corpus has to be named explicitly.
    GLIQUID_CACHE_DIR = {toxinidir}/cache
commands =
    python "{toxinidir}/scripts/run_notebooks.py"

# ---------------------------------------------------------------------------
# Per-package diagnostic environments (added on-demand after Phase 1 failures)
# ---------------------------------------------------------------------------
# Pattern — copy and edit to isolate a suspected package:
#
# [testenv:py3XX-diag-PACKAGE-min]
# basepython = {env:GLIQTEST_PY3XX:python3.XX}
# package = wheel
# wheel_build_env = .pkg
# extras = test
# deps = PACKAGE==<min_version>
# passenv = NEW_MP_API_KEY
# commands = pytest tests tests_internal -v --tb=short -x
