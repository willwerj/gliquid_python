# Cross-version matrix: py3XX-{min,max} run the tests, py3XX-max-notebooks the notebooks.
# Set GLIQTEST_PY3XX per interpreter, then `tox -p 4`. Min envs read GLIQUID_MIN_CONSTRAINTS
# (a space-free path); never set PIP_CONSTRAINT directly, it leaks into the max envs.

[tox]
envlist =
    py{310,311,312,313}-{min,max}
minversion = 4.0
isolated_build = true

# ---------------------------------------------------------------------------
# Max environments — latest allowed package versions, no version floor
# ---------------------------------------------------------------------------
[testenv:py{310,311,312,313}-max]
basepython =
    py310: {env:GLIQTEST_PY310:python3.10}
    py311: {env:GLIQTEST_PY311:python3.11}
    py312: {env:GLIQTEST_PY312:python3.12}
    py313: {env:GLIQTEST_PY313:python3.13}
package = wheel
# One shared .pkg build env: per-version build envs fail on Windows/conda.
wheel_build_env = .pkg
extras = test
passenv =
    NEW_MP_API_KEY
    GLIQTEST_PY310
    GLIQTEST_PY311
    GLIQTEST_PY312
    GLIQTEST_PY313
setenv =
    # A wheel install cannot find the checkout's cache corpus; point at it.
    GLIQUID_CACHE_DIR = {toxinidir}/cache
commands =
    pytest tests -n 4 --dist worksteal -v --tb=short

# ---------------------------------------------------------------------------
# Min environments — all packages pinned to minimum allowed versions
# ---------------------------------------------------------------------------
[testenv:py{310,311,312,313}-min]
basepython =
    py310: {env:GLIQTEST_PY310:python3.10}
    py311: {env:GLIQTEST_PY311:python3.11}
    py312: {env:GLIQTEST_PY312:python3.12}
    py313: {env:GLIQTEST_PY313:python3.13}
package = wheel
wheel_build_env = .pkg
extras = test
passenv =
    NEW_MP_API_KEY
    GLIQTEST_PY310
    GLIQTEST_PY311
    GLIQTEST_PY312
    GLIQTEST_PY313
    GLIQUID_MIN_CONSTRAINTS
setenv =
    PIP_CONSTRAINT = {env:GLIQUID_MIN_CONSTRAINTS}
    # A wheel install cannot find the checkout's cache corpus; point at it.
    GLIQUID_CACHE_DIR = {toxinidir}/cache
commands =
    pytest tests -n 4 --dist worksteal -v --tb=short

# ---------------------------------------------------------------------------
# Notebook environments (run after confirming tests pass)
# ---------------------------------------------------------------------------
[testenv:py{310,311,312,313}-max-notebooks]
basepython =
    py310: {env:GLIQTEST_PY310:python3.10}
    py311: {env:GLIQTEST_PY311:python3.11}
    py312: {env:GLIQTEST_PY312:python3.12}
    py313: {env:GLIQTEST_PY313:python3.13}
package = wheel
wheel_build_env = .pkg
extras = test,notebook
deps =
    nbconvert>=7.0
passenv =
    NEW_MP_API_KEY
    GLIQTEST_PY310
    GLIQTEST_PY311
    GLIQTEST_PY312
    GLIQTEST_PY313
setenv =
    # A wheel install cannot find the checkout's cache corpus; point at it.
    GLIQUID_CACHE_DIR = {toxinidir}/cache
commands =
    python "{toxinidir}/scripts/run_notebooks.py"

# To isolate one package, copy a -min env as [testenv:py3XX-diag-PACKAGE-min] with
# deps = PACKAGE==<min_version>.
