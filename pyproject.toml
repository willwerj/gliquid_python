[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gliquid"
# The version comes from the git tag (hatch-vcs); see [tool.hatch.version].
dynamic = ["version"]
dependencies = [
    # >=5.24 works with pandas 3; <6 keeps the fill behaviour the solid-solution envelope uses.
    "plotly>=5.24,<6.0.0",
    # <0.86: later emmet-core breaks live Materials Project fetches. Do not lift.
    "emmet-core>=0.84,<0.86",
    "mp-api>=0.45.1",
    "pymatgen>=2024.1.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.10.0",
    "sympy>=1.13",
    "tqdm>=4.65",
    # No ML packages here: they are the `ml` extra (test_optional_ml_extras.py checks this).
]
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Joshua Willwerth", email = "willwerj@umich.edu"},
    {name = "Abrar Rauf", email = "arauf@umich.edu"},
    {name = "Shibo Tan", email = "shibot@umich.edu"},
    {name = "Wenhao Sun", email = "whsun@umich.edu"}
]
maintainers = [
    {name = "Joshua Willwerth", email = "willwerj@umich.edu"}
]
description = "A package for fitting DFT-referenced liquid free energies from digitized equilibrium phase boundaries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "Density Functional Theory (DFT)",
    "Thermodynamic Modeling",
    "Equilibrium",
    "Liquidus",
    "Solution Phase",
    "Intermetallic Phase",
    "Materials Project (MP)",
    "Materials Platform for Data Science (MPDS)"
]
# No license classifier: the SPDX `license` above and a classifier together fail the build.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
mpds = [
    "mpds-client"
]
ml = [
    # The shipped bundle needs only xgboost. xgboost-cpu has no CUDA dependencies and no macOS
    # wheels, so macOS takes plain xgboost.
    "xgboost-cpu>=2.1.1,<4; sys_platform != 'darwin'",
    "xgboost>=2.0,<4; sys_platform == 'darwin'",
]
test = [
    "pytest>=7.0",
    "pytest-xdist[psutil]>=3.5",
    "ruff>=0.16,<0.17",
    # Unpinned on purpose; shap is left out because no test uses it.
    "gliquid[ml]",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3.0",
    "openpyxl>=3.1.5",
]
notebook = [
    # Local Jupyter, plus the widget stack ConvexHullEditor needs to construct.
    "jupyter>=1.1.1",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://viz.whsunresearch.group/gliquid/interactive-matrix.html"
TernaryInterpolation = "https://viz.whsunresearch.group/gliquid/ternary-interpolation/"
Repository = "https://github.com/willwerj/gliquid_python"
Documentation = "https://github.com/willwerj/gliquid_python#readme"
Issues = "https://github.com/willwerj/gliquid_python/issues"
Changelog = "https://github.com/willwerj/gliquid_python/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
# 0.0.0 on purpose: a build that cannot see the git tag must produce an obviously wrong version.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
# Generated at build time and gitignored.
version-file = "src/gliquid/_version.py"

[tool.hatch.build.targets.wheel]
# Ships everything under src/gliquid, including reference/ and models/.
packages = ["src/gliquid"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    # The external data corpus. Path-anchored: rename this with the directory.
    "/cache",
]

[tool.ruff]
line-length = 100
# Keep in step with requires-python's floor.
target-version = "py310"
extend-exclude = ["notebooks", ".tox"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is the formatter's job
    "B905",  # zip(strict=) is a per-call decision
    "E402",  # binary.py re-exports above BLPlotter; tests import after sys.path/importorskip gates
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pins: frozen-value characterization pin. Re-freeze deliberately with the freezer script named in the file's docstring -- never edit a pin to make it pass.",
    "needs_cache: needs the maintainer's per-system corpus store. Skips (does not fail) without it.",
    "needs_network: needs NEW_MP_API_KEY and a live Materials Project connection.",
    "directory_only: needs a DIRECTORY cache store (on-disk filenames, dir_structure, the atomic-write or cold-fetch write path). Skipped when GLIQUID_TEST_SQLITE_STORE swaps in a single-file store; see conftest.py.",
]
# Never add -n here: single-test runs must stay in one process.
addopts = "--strict-markers"
