name: Release

# Tagging IS the release. hatch-vcs derives the distribution version from the tag, so there
# is no version literal to bump in src/ -- see the release checklist in CONTRIBUTING.md.
on:
  push:
    tags: ['v*']

# No API token: both publish jobs use PyPI Trusted Publishing (OIDC via id-token: write).
permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Required: without tags hatch-vcs silently builds and publishes version 0.0.0.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Show built version
        # A 0.0.0 filename means the build missed the tag: release nothing.
        run: ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC identity for Trusted Publishing; see the note at the top

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: [testpypi]
    runs-on: ubuntu-latest

    # Required: the `pypi` environment's reviewer rule pauses the run before PyPI. Do not remove.
    environment: pypi
    permissions:
      id-token: write  # OIDC identity for Trusted Publishing; see the note at the top

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # see the note on the build job

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release and attach artifacts
        env:
          # The automatic, job-scoped GitHub Actions token -- not a stored credential.
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
