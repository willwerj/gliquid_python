name: Run Tests

# Every branch, and pull requests into main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test-cached:
    name: Cached Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # The corpus lookup walks up to a directory named gliquid_python, which a checkout
      # under another repository name does not have.
      GLIQUID_CACHE_DIR: ${{ github.workspace }}/cache

    strategy:
      # One version failing must not hide the state of the other three.
      fail-fast: false
      matrix:
        # Mirrors requires-python = ">=3.10,<3.14" and the tox compat matrix.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Required: without tags hatch-vcs silently builds version 0.0.0.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install package and test extra
        # The test extra, as CONTRIBUTING.md installs it.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run cached tests
        # In parallel. The live Materials Project fetches are deselected by marker; the API
        # job below runs them.
        run: pytest tests -n auto --dist worksteal -m "not needs_network" --tb=short --durations=25

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: test-cached
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GLIQUID_CACHE_DIR: ${{ github.workspace }}/cache  # see the cached job

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # see the note on the cached job

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
            ${{ runner.os }}-pip-

      - name: Install package and test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run API tests
        env:
          NEW_MP_API_KEY: ${{ secrets.NEW_MP_API_KEY }}
        run: pytest tests/test_dft_data_loading.py -v --tb=short

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # see the note on the cached job

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Ruff lint
        run: ruff check src/gliquid tests

      - name: Ruff format check
        run: ruff format --check src/gliquid tests
